<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="740" viewBox="0 0 1360 740" role="img" aria-labelledby="title description">
  <title id="title">eduMEET Docker network paths</title>
  <desc id="description">Overview of browser traffic through the reverse proxy, direct media traffic between browsers and media nodes, and the optional TURN relay path. Exact ports are documented separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #475569; }
    .section { font-size: 21px; font-weight: 700; }
    .box-title { font-size: 19px; font-weight: 700; }
    .detail { font-size: 16px; }
    .small { font-size: 15px; fill: #475569; }
    .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
    .both { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    .optional { fill: none; stroke: #6b4ca5; stroke-width: 2.5; stroke-dasharray: 8 6; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .browser { fill: #e8f2ff; stroke: #3974b8; stroke-width: 2; }
    .service { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
    .internal { fill: #fff7e6; stroke: #b7791f; stroke-width: 2; }
    .optional-box { fill: #f5f0ff; stroke: #6b4ca5; stroke-width: 2; stroke-dasharray: 7 5; }
  </style>

  <rect width="1360" height="740" fill="#ffffff"/>
  <text x="40" y="48" class="title">eduMEET Docker: network paths</text>
  <text x="40" y="78" class="subtitle">A connection overview only. Use the networking guide for the current ports and configured ranges.</text>

  <rect x="30" y="100" width="1300" height="190" rx="12" class="panel"/>
  <text x="50" y="133" class="section">1. Web interface and signaling</text>
  <rect x="60" y="170" width="210" height="82" rx="8" class="browser"/>
  <text x="165" y="205" text-anchor="middle" class="box-title">User's browser</text>
  <text x="165" y="231" text-anchor="middle" class="small">web and meeting client</text>
  <path d="M270 211 H420" class="both"/>
  <text x="345" y="190" text-anchor="middle" class="small">web requests</text>
  <rect x="420" y="170" width="240" height="82" rx="8" class="service"/>
  <text x="540" y="205" text-anchor="middle" class="box-title">Reverse proxy</text>
  <text x="540" y="231" text-anchor="middle" class="small">public entry point</text>
  <path d="M660 211 H830" class="line"/>
  <text x="745" y="190" text-anchor="middle" class="small">routes to services</text>
  <rect x="830" y="153" width="460" height="116" rx="8" class="internal"/>
  <text x="1060" y="187" text-anchor="middle" class="box-title">Internal application services</text>
  <text x="1060" y="216" text-anchor="middle" class="detail">Web client · room server · management server</text>
  <text x="1060" y="242" text-anchor="middle" class="small">Identity provider is optional</text>

  <rect x="30" y="310" width="1300" height="200" rx="12" class="panel"/>
  <text x="50" y="343" class="section">2. Direct media path</text>
  <rect x="60" y="378" width="210" height="82" rx="8" class="browser"/>
  <text x="165" y="413" text-anchor="middle" class="box-title">User's browser</text>
  <text x="165" y="439" text-anchor="middle" class="small">media sender / receiver</text>
  <rect x="420" y="360" width="240" height="82" rx="8" class="internal"/>
  <text x="540" y="395" text-anchor="middle" class="box-title">Room server</text>
  <text x="540" y="421" text-anchor="middle" class="small">room and media control</text>
  <rect x="900" y="378" width="240" height="82" rx="8" class="service"/>
  <text x="1020" y="413" text-anchor="middle" class="box-title">Media node</text>
  <text x="1020" y="439" text-anchor="middle" class="small">real-time media</text>
  <path d="M660 401 H900" class="line"/>
  <text x="780" y="380" text-anchor="middle" class="small">media control</text>
  <path d="M270 470 C440 495 720 495 900 470" class="both"/>
  <text x="585" y="477" text-anchor="middle" class="small">browser media connection</text>

  <rect x="30" y="530" width="1300" height="180" rx="12" class="panel"/>
  <text x="50" y="563" class="section">3. Optional TURN relay path</text>
  <rect x="60" y="595" width="210" height="78" rx="8" class="browser"/>
  <text x="165" y="628" text-anchor="middle" class="box-title">User's browser</text>
  <text x="165" y="652" text-anchor="middle" class="small">when direct media fails</text>
  <rect x="420" y="595" width="240" height="78" rx="8" class="service"/>
  <text x="540" y="628" text-anchor="middle" class="box-title">Reverse proxy</text>
  <text x="540" y="652" text-anchor="middle" class="small">secure TURN entry</text>
  <rect x="780" y="595" width="210" height="78" rx="8" class="internal"/>
  <text x="885" y="628" text-anchor="middle" class="box-title">TURN relay</text>
  <text x="885" y="652" text-anchor="middle" class="small">relays media</text>
  <rect x="1090" y="595" width="200" height="78" rx="8" class="service"/>
  <text x="1190" y="628" text-anchor="middle" class="box-title">Media node</text>
  <text x="1190" y="652" text-anchor="middle" class="small">media destination</text>
  <path d="M270 634 H420" class="optional"/>
  <path d="M660 634 H780" class="optional"/>
  <path d="M990 634 H1090" class="optional"/>
</svg>
