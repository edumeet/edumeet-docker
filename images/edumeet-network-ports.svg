<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title description">
  <title id="title">eduMEET Docker network and default ports</title>
  <desc id="description">Three paths show the website and signaling through the proxy, direct media to the media node, and TURN traffic through the proxy and coturn to the media node. Internal ports must not be opened to the public.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #475569; }
    .section { font-size: 21px; font-weight: 700; }
    .box-title { font-size: 20px; font-weight: 700; }
    .detail { font-size: 16px; }
    .small { font-size: 15px; fill: #475569; }
    .port { font-size: 17px; font-weight: 700; }
    .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
    .both { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .client { fill: #e8f2ff; stroke: #3974b8; stroke-width: 2; }
    .service { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
    .internal { fill: #fff7e6; stroke: #b7791f; stroke-width: 2; }
  </style>

  <rect width="1500" height="930" fill="#ffffff"/>
  <text x="40" y="52" class="title">eduMEET Docker: network paths and default ports</text>
  <text x="40" y="82" class="subtitle">Arrows show connection paths. Public ports cross the internet-facing firewall; internal ports are not public.</text>

  <rect x="30" y="105" width="1440" height="220" rx="12" class="panel"/>
  <text x="50" y="137" class="section">1. Website and signaling</text>
  <rect x="50" y="190" width="200" height="88" rx="8" class="client"/>
  <text x="150" y="227" text-anchor="middle" class="box-title">User's browser</text>
  <text x="150" y="253" text-anchor="middle" class="small">Internet</text>
  <path d="M250 234 H390" class="line"/>
  <text x="320" y="202" text-anchor="middle" class="port">80/TCP</text>
  <text x="320" y="223" text-anchor="middle" class="port">443/TCP</text>
  <text x="320" y="262" text-anchor="middle" class="small">public</text>
  <rect x="390" y="190" width="240" height="88" rx="8" class="service"/>
  <text x="510" y="227" text-anchor="middle" class="box-title">Nginx proxy</text>
  <text x="510" y="253" text-anchor="middle" class="small">main domain</text>
  <path d="M630 234 H815" class="line"/>
  <text x="722" y="219" text-anchor="middle" class="small">Docker network</text>
  <rect x="815" y="165" width="610" height="138" rx="8" class="internal"/>
  <text x="840" y="195" class="box-title">Internal services</text>
  <text x="840" y="222" class="detail">Client website, room server, management server, Keycloak</text>
  <text x="840" y="249" class="small">Management server connects to the database; authentication is optional.</text>
  <text x="840" y="276" class="small">Port 80 also serves HTTP certificate validation and redirects to HTTPS.</text>

  <rect x="30" y="345" width="1440" height="205" rx="12" class="panel"/>
  <text x="50" y="377" class="section">2. Direct audio, video, and other media</text>
  <rect x="50" y="420" width="200" height="88" rx="8" class="client"/>
  <text x="150" y="457" text-anchor="middle" class="box-title">User's browser</text>
  <text x="150" y="483" text-anchor="middle" class="small">Internet</text>
  <path d="M250 464 H455" class="both"/>
  <text x="352" y="432" text-anchor="middle" class="port">40000-40249</text>
  <text x="352" y="453" text-anchor="middle" class="port">TCP + UDP</text>
  <text x="352" y="492" text-anchor="middle" class="small">public</text>
  <rect x="455" y="420" width="240" height="88" rx="8" class="service"/>
  <text x="575" y="457" text-anchor="middle" class="box-title">Media node</text>
  <text x="575" y="483" text-anchor="middle" class="small">host network</text>
  <path d="M895 464 H695" class="line"/>
  <text x="795" y="432" text-anchor="middle" class="port">3000/TCP</text>
  <text x="795" y="453" text-anchor="middle" class="small">service control</text>
  <text x="795" y="492" text-anchor="middle" class="small">restricted</text>
  <rect x="895" y="420" width="240" height="88" rx="8" class="internal"/>
  <text x="1015" y="457" text-anchor="middle" class="box-title">Room server</text>
  <text x="1015" y="483" text-anchor="middle" class="small">Docker network</text>

  <rect x="30" y="570" width="1440" height="250" rx="12" class="panel"/>
  <text x="50" y="602" class="section">3. TURN relay when a direct connection is not possible</text>
  <rect x="50" y="660" width="200" height="88" rx="8" class="client"/>
  <text x="150" y="697" text-anchor="middle" class="box-title">User's browser</text>
  <text x="150" y="723" text-anchor="middle" class="small">Internet</text>
  <path d="M250 704 H390" class="both"/>
  <text x="320" y="673" text-anchor="middle" class="port">443/TCP</text>
  <text x="320" y="731" text-anchor="middle" class="small">public, TLS</text>
  <rect x="390" y="660" width="240" height="88" rx="8" class="service"/>
  <text x="510" y="697" text-anchor="middle" class="box-title">Nginx proxy</text>
  <text x="510" y="723" text-anchor="middle" class="small">media domain; internal 3479</text>
  <path d="M630 704 H815" class="line"/>
  <text x="722" y="673" text-anchor="middle" class="port">3478/TCP</text>
  <text x="722" y="731" text-anchor="middle" class="small">restricted</text>
  <rect x="815" y="660" width="220" height="88" rx="8" class="internal"/>
  <text x="925" y="697" text-anchor="middle" class="box-title">Coturn</text>
  <text x="925" y="723" text-anchor="middle" class="small">host network</text>
  <path d="M1035 704 H1210" class="both"/>
  <text x="1122" y="650" text-anchor="middle" class="port">50000-60000</text>
  <text x="1122" y="670" text-anchor="middle" class="port">UDP relay</text>
  <text x="1122" y="731" text-anchor="middle" class="small">coturn relay ports</text>
  <text x="1122" y="750" text-anchor="middle" class="small">public</text>
  <rect x="1210" y="660" width="215" height="88" rx="8" class="service"/>
  <text x="1317" y="697" text-anchor="middle" class="box-title">Media node</text>
  <text x="1317" y="723" text-anchor="middle" class="small">40000-40249</text>
  <text x="50" y="790" class="small">The browser connects to TURN on 443/TCP. Coturn exchanges relayed media with the media node over UDP.</text>

  <text x="40" y="864" class="detail">Public defaults: 80/TCP (optional), 443/TCP, 40000-40249/TCP+UDP, 50000-60000/UDP.</text>
  <text x="40" y="891" class="small">Ports 3000, 3478, and 3479 are internal or restricted. Adjust firewall rules if the configured ranges change.</text>
</svg>
