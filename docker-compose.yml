services:
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
     - ./certbot/conf:/etc/letsencrypt
     - ./certbot/www:/var/www/certbot
    environment:
     - USE_CERTBOT=${USE_CERTBOT}
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do [ \"$USE_CERTBOT\" = \"true\" ] && (echo \"Running single Certbot renewal.\" && certbot renew); sleep 12h & wait $${!}; done;'"
  proxy:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    # user: "101:101"
    # https://man7.org/linux/man-pages/man7/capabilities.7.html
    #cap_drop:
    # - ALL
    #cap_add:
    # - NET_BIND_SERVICE
    volumes:
     - ./configs/proxy:/etc/nginx/templates:ro
     - ./certbot/conf:/etc/letsencrypt:ro
     - ./certbot/www:/var/www/certbot:ro
    ports:
     - "80:80"
     - "443:443"
    environment:
     - MAIN_DOMAIN=${MAIN_DOMAIN}
     - MEDIA_DOMAIN=${MEDIA_DOMAIN}
     - LISTEN_IP=${LISTEN_IP}
    command: "/bin/sh -c 'envsubst \"\\$${MAIN_DOMAIN},\\$${LISTEN_IP},\\$${MEDIA_DOMAIN}\" < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && while :; do nginx -s reload; sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    networks:
      - public_net
      - internal_net                  # Only talks to backend
  turn:
      image: "${COTURN_IMAGE}"
      restart: unless-stopped
      network_mode: host
      environment:
        - MEDIA_SECRET=${MEDIA_SECRET}
      # The shared secret goes into a configuration file in the container, not onto the command
      # line, which every account on the host can read in the process list.
      # LOCAL_IP is this host's own address, the private one behind NAT. coturn maps EXTERNAL_IP to
      # it and allows it as a peer, so the media node on this host stays reachable. It must never be
      # 0.0.0.0: coturn then allows every peer.
      entrypoint:
        - /bin/sh
        - -c
        - >-
          umask 077 &&
          printf 'static-auth-secret=%s\n' "$$MEDIA_SECRET" > /tmp/turnserver.conf &&
          exec turnserver -c /tmp/turnserver.conf
          --min-port=50000
          --max-port=60000
          --realm=${MEDIA_DOMAIN}
          --external-ip=${EXTERNAL_IP}/${LOCAL_IP:-${EXTERNAL_IP}}
          --external-ip=${EXTERNAL_IP}
          --listening-ip=${LISTEN_IP}
          --fingerprint
          --use-auth-secret
          --no-tls
          --no-multicast-peers
          --no-tcp-relay
          --denied-peer-ip=0.0.0.0-0.255.255.255
          --denied-peer-ip=10.0.0.0-10.255.255.255
          --denied-peer-ip=100.64.0.0-100.127.255.255
          --denied-peer-ip=127.0.0.0-127.255.255.255
          --denied-peer-ip=169.254.0.0-169.254.255.255
          --denied-peer-ip=172.16.0.0-172.31.255.255
          --denied-peer-ip=192.168.0.0-192.168.255.255
          --denied-peer-ip=::1
          --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
          --allowed-peer-ip=${EXTERNAL_IP}
          --user-quota=12
          "$$@"
        - turnserver
      # Options in a command: of this service (for example in docker-compose.override.yml) are
      # added after these, so they can change or add settings, for example:
      #   command: --min-port=50000 --max-port=50249
      # Leave out -n and --static-auth-secret: the secret comes from the file above.

  edumeet-room-server:
    env_file: .env
    restart: unless-stopped
    volumes:
      - './configs/server/config.json.template:/usr/src/app/config/config.json.template:ro'
      # If running separately and you need certs
      # - ./certs:/usr/src/app/certs
    container_name: edumeet-room-server
    # Comment out whole build-section to build edumeet-room-server and not pulling from docher-hub
    build:
      args:
        - 'GIT_SERVER=${GIT_SERVER}'
        - 'REPOSITORY=${REPOSITORY}'
        - 'EDUMEET_SERVER=${EDUMEET_SERVER}'
        - 'BRANCH_SERVER=${BRANCH_SERVER}'
      context: .
      dockerfile: Dockerfiles/Dockerfile-room-server
    image: '${REPOSITORY}/${EDUMEET_SERVER}:${TAG}'
    #to expose prometheus on localhost
    #ports:
    # - "127.0.0.1:3081:3080"
    networks:
     - internal_net                  # Talk to proxy
  edumeet-tracker:
    env_file: .env
    restart: unless-stopped
    container_name: edumeet-tracker
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile-tracker
    image: '${REPOSITORY}/tracker:4.2'
    networks:
      - internal_net     # Internal-only network (shared with proxy)
  edumeet-client:
    # nginx container
    # env_file: .env
    volumes:
      - './configs/app:/app/config:ro'
    container_name: edumeet-client
    build:
      args:
        - GIT_SERVER=${GIT_SERVER}
        - REPOSITORY=${REPOSITORY}
        - EDUMEET_CLIENT=${EDUMEET_CLIENT}
        - BRANCH_CLIENT=${BRANCH_CLIENT}
        - NGINX_IMAGE=${NGINX_IMAGE}
      context: .
      dockerfile: Dockerfiles/Dockerfile-client
    image: '${REPOSITORY}/${EDUMEET_CLIENT}:${TAG}'
    networks:
     - internal_net                  # Talk to proxy

  edumeet-media-node:
    env_file: .env
    container_name: edumeet-media-node
    restart: unless-stopped
    build:
      args:
        - 'GIT_SERVER=${GIT_SERVER}'
        - 'REPOSITORY=${REPOSITORY}'
        - 'EDUMEET_MN_SERVER=${EDUMEET_MN_SERVER}'
        - 'BRANCH_MN_SERVER=${BRANCH_MN_SERVER}'
        - 'LISTEN_IP=${LISTEN_IP}'
        - 'MN_EXTRA_PARAMS=${MN_EXTRA_PARAMS}'
      context: .
      dockerfile: Dockerfiles/Dockerfile-media-node
    image: '${REPOSITORY}/${EDUMEET_MN_SERVER}:${TAG}'
    security_opt:
     - no-new-privileges:true
    network_mode: "host"
    command: >
      DEBUG=*
      --listenPort ${LISTEN_PORT}
      --rtcMinPort ${RTC_MIN_PORT}
      --rtcMaxPort ${RTC_MAX_PORT}
      --ip ${LISTEN_IP}
      --secret ${MEDIA_SECRET}
      --announcedIp ${EXTERNAL_IP}
      --availableUpload ${MN_AVAILABLE_UPLOAD}
      --availableDownload ${MN_AVAILABLE_DOWNLOAD}
      --imageTag ${TAG}
    # ${MN_EXTRA_PARAMS}

  edumeet-management-server:
    env_file: .env
    container_name: edumeet-management-server
    restart: unless-stopped
    volumes:
      - './configs/mgmt/default.json:/usr/src/app/config/default.json:ro'
      - './configs/_mgmt_pwchange/202310300000000_migrate.ts:/usr/src/app/migrations/202310300000000_migrate.ts:ro'
    build:
      args:
        - 'GIT_SERVER=${GIT_SERVER}'
        - 'REPOSITORY=${REPOSITORY}'
        - 'EDUMEET_MGMT_SERVER=${EDUMEET_MGMT_SERVER}'
        - 'BRANCH_MGMT_SERVER=${BRANCH_MGMT_SERVER}'
        - 'NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED}'
      context: .
      dockerfile: Dockerfiles/Dockerfile-management-server
    image: '${REPOSITORY}/${EDUMEET_MGMT_SERVER}:${TAG}'
    networks:
      - internal_net                  # Talk to proxy
      - private_net                   # Talk to db
    depends_on:
      - edumeet-db
  keycloak:
    env_file: .env
    container_name: edumeet-keycloak
    volumes:
      - './certs:/opt/keycloak/conf'
    image:  ${KEYCLOAK_IMAGE}
    command:
      - start
    restart: unless-stopped
    networks:
      - internal_net     # Internal-only network (shared with proxy)

  edumeet-db:
    env_file: .env
    image: '${POSTGRES_IMAGE}'
    container_name: edumeet-db
    restart: always
    volumes:
      - 'edumeet-db:/var/lib/postgresql'
    networks:
      - private_net                   # Only backend can access

volumes:
  edumeet-db:
    driver: local
  edumeet-db-data:
    driver: local
  keycloak-data:
    driver: local

networks:
  public_net:
  internal_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true                    # Isolates it from host access
